name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Upload dist/parcel-tracking-card.js
        uses: softprops/action-gh-release@v2
        with:
          files: dist/parcel-tracking-card.js
